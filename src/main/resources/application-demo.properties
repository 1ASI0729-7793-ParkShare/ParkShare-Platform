# Demo profile: cloud deployment for the course project (no login in the frontend yet).
# Same as prod for the database (Postgres, SSL), but security is OFF and demo data is seeded.
# Do NOT use with real user data. When login is wired, switch to the prod profile.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT:5432}/${DATABASE_NAME}?sslmode=require
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

authorization.jwt.secret=${JWT_SECRET:parkshare-demo-secret-change-me-parkshare-demo-secret-change-me}
app.security.enabled=false
app.seed.enabled=${APP_SEED_ENABLED:true}
