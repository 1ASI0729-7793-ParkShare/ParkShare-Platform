spring.application.name=parkshare-platform
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.physical_naming_strategy=com.acme.parkshare.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Photo uploads
app.storage.dir=${STORAGE_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Time zone used to decide which day/month a reservation belongs to on the dashboard
app.timezone=${APP_TIMEZONE:America/Lima}

# JWT
authorization.jwt.expiration.days=7

# Origins allowed by the security CORS filter (comma-separated)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
