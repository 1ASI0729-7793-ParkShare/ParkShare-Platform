spring.application.name=parkshare-platform
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.url=jdbc:mysql://localhost:3306/parkshare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.physical_naming_strategy=com.acme.parkshare.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
