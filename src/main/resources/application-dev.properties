# Development profile (default)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:parkshare_db}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Development-only secret. Production must provide JWT_SECRET.
authorization.jwt.secret=${JWT_SECRET:parkshare-dev-secret-change-me-parkshare-dev-secret-change-me}

# Security off in dev so the Angular app works before login is wired. Set to true to test JWT.
app.security.enabled=${APP_SECURITY_ENABLED:false}

# Seed demo data (owner, driver, listings, bookings) on startup
app.seed.enabled=${APP_SEED_ENABLED:true}
